<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini POS Kasir</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Pacifico&display=swap"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="text-center py-4">
        <h1 class="brand">🌸 Mini POS Kasir</h1>

        <p class="subtitle mb-0">
            Erlin Agesti Risadi
            <span>&bull;</span>
            124140009
        </p>
    </header>


    <main class="container pb-5">

        <div class="row g-4">

            <!-- ========================= -->
            <!-- FORM TAMBAH BARANG -->
            <!-- ========================= -->
            <section class="col-lg-4">

                <div class="card cute-card h-100">

                    <div class="card-header">
                        🛍️ Tambah Barang
                    </div>

                    <div class="card-body">

                        <form id="formBarang" novalidate>

                            <!-- Nama Barang -->
                            <div class="mb-3">
                                <label for="nama" class="form-label">
                                    Nama Barang
                                </label>

                                <input
                                    type="text"
                                    id="nama"
                                    class="form-control"
                                    placeholder="Contoh: Boba Taro"
                                >

                                <div
                                    id="errNama"
                                    class="error-msg"
                                ></div>
                            </div>


                            <!-- Harga -->
                            <div class="mb-3">
                                <label for="harga" class="form-label">
                                    Harga (Rp)
                                </label>

                                <input
                                    type="number"
                                    id="harga"
                                    class="form-control"
                                    placeholder="Contoh: 15000"
                                >

                                <div
                                    id="errHarga"
                                    class="error-msg"
                                ></div>
                            </div>


                            <!-- Quantity -->
                            <div class="mb-3">
                                <label for="qty" class="form-label">
                                    Jumlah
                                </label>

                                <input
                                    type="number"
                                    id="qty"
                                    class="form-control"
                                    value="1"
                                    min="1"
                                >

                                <div
                                    id="errQty"
                                    class="error-msg"
                                ></div>
                            </div>


                            <!-- Submit -->
                            <button
                                type="submit"
                                class="btn btn-pink w-100"
                            >
                                + Tambah ke Keranjang
                            </button>

                        </form>

                    </div>
                </div>

            </section>


            <!-- ========================= -->
            <!-- KERANJANG & PEMBAYARAN -->
            <!-- ========================= -->
            <section class="col-lg-8">

                <!-- Keranjang -->
                <div class="card cute-card mb-4">

                    <div class="card-header">
                        🧺 Keranjang Belanja
                    </div>

                    <div class="table-responsive">

                        <table class="table align-middle mb-0">

                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Barang</th>
                                    <th class="text-end">Harga</th>
                                    <th class="text-center">Qty</th>
                                    <th class="text-end">Subtotal</th>
                                    <th></th>
                                </tr>
                            </thead>

                            <tbody id="daftarBarang">
                                <!-- Data barang ditampilkan melalui JavaScript -->
                            </tbody>

                        </table>

                    </div>
                </div>


                <!-- Pembayaran -->
                <div class="card cute-card">

                    <div class="card-header">
                        💖 Pembayaran
                    </div>

                    <div class="card-body">

                        <div class="row g-3">

                            <!-- Promo -->
                            <div class="col-md-6">

                                <label
                                    for="kodePromo"
                                    class="form-label"
                                >
                                    Kode Promo
                                </label>

                                <div class="input-group">

                                    <input
                                        type="text"
                                        id="kodePromo"
                                        class="form-control"
                                        placeholder="HEMAT10"
                                    >

                                    <button
                                        type="button"
                                        id="btnPromo"
                                        class="btn btn-outline-pink"
                                    >
                                        Pakai
                                    </button>

                                </div>

                                <div
                                    id="pesanPromo"
                                    class="small mt-1"
                                ></div>

                            </div>


                            <!-- Uang Bayar -->
                            <div class="col-md-6">

                                <label
                                    for="uangBayar"
                                    class="form-label"
                                >
                                    Uang Bayar (Rp)
                                </label>

                                <input
                                    type="number"
                                    id="uangBayar"
                                    class="form-control"
                                    placeholder="0"
                                    min="0"
                                >

                            </div>

                        </div>


                        <!-- Ringkasan -->
                        <ul class="list-unstyled summary mt-4 mb-3">

                            <li>
                                <span>Total</span>
                                <strong id="total">
                                    Rp 0
                                </strong>
                            </li>

                            <li>
                                <span>Diskon 10%</span>
                                <strong id="diskon">
                                    - Rp 0
                                </strong>
                            </li>

                            <li class="grand">
                                <span>Total Bayar</span>
                                <strong id="totalBayar">
                                    Rp 0
                                </strong>
                            </li>

                            <li>
                                <span>Kembalian</span>
                                <strong id="kembalian">
                                    Rp 0
                                </strong>
                            </li>

                        </ul>


                        <!-- Status Pembayaran -->
                        <div
                            id="statusBayar"
                            class="status-box"
                        ></div>


                        <!-- Reset -->
                        <button
                            type="button"
                            id="btnReset"
                            class="btn btn-outline-pink w-100 mt-3"
                        >
                            🔄 Transaksi Baru
                        </button>

                    </div>
                </div>

            </section>

        </div>

    </main>


    <!-- Footer -->
    <footer class="text-center pb-4 subtitle">
        Created By Erlin Agesti Risadi | 124140009 | Kelas RB
    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
